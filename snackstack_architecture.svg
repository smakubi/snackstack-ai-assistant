<svg width="100%" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  .box-teal { fill: #E1F5EE; stroke: #0F6E56; }
  .box-gray { fill: #F1EFE8; stroke: #5F5E5A; }
  .box-purple { fill: #EEEDFE; stroke: #534AB7; }
  .box-blue { fill: #E6F1FB; stroke: #185FA5; }
  .box-coral { fill: #FAECE7; stroke: #993C1D; }
  .box-green { fill: #EAF3DE; stroke: #3B6D11; }
  .tool-blue { fill: #E6F1FB; stroke: #185FA5; stroke-dasharray: 4 2; }
  .tool-coral { fill: #FAECE7; stroke: #993C1D; stroke-dasharray: 4 2; }
  .title { font-size: 14px; font-weight: 500; }
  .sub { font-size: 12px; fill: #5F5E5A; }
  .title-teal { fill: #085041; }
  .title-gray { fill: #2C2C2A; }
  .title-purple { fill: #26215C; }
  .title-blue { fill: #0C447C; }
  .title-coral { fill: #4A1B0C; }
  .title-green { fill: #173404; }
  .arr { stroke: #888; stroke-width: 1.5; }
  .label { font-size: 12px; fill: #5F5E5A; font-style: italic; }
  .side-label { font-size: 12px; fill: #888; }
  .legend { font-size: 11px; fill: #888; }
</style>

<rect class="box-teal" x="80" y="30" width="160" height="44" rx="8" stroke-width="0.5"/>
<text class="title title-teal" x="160" y="52" text-anchor="middle" dominant-baseline="central">Voice input</text>
<rect class="box-gray" x="440" y="30" width="160" height="44" rx="8" stroke-width="0.5"/>
<text class="title title-gray" x="520" y="52" text-anchor="middle" dominant-baseline="central">Text input</text>

<rect class="box-teal" x="80" y="115" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="title title-teal" x="160" y="135" text-anchor="middle" dominant-baseline="central">Whisper STT</text>
<text class="sub" x="160" y="153" text-anchor="middle" dominant-baseline="central">recorder.py</text>

<rect class="box-purple" x="210" y="215" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="title title-purple" x="340" y="235" text-anchor="middle" dominant-baseline="central">Orchestrator</text>
<text class="sub" x="340" y="253" text-anchor="middle" dominant-baseline="central">Pydantic structured routing</text>

<rect class="box-blue" x="75" y="340" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="title title-blue" x="155" y="360" text-anchor="middle" dominant-baseline="central">Menu agent</text>
<text class="sub" x="155" y="378" text-anchor="middle" dominant-baseline="central">menu_agent.py</text>
<rect class="box-coral" x="445" y="340" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="title title-coral" x="525" y="360" text-anchor="middle" dominant-baseline="central">Order agent</text>
<text class="sub" x="525" y="378" text-anchor="middle" dominant-baseline="central">order_agent.py</text>

<rect class="tool-blue" x="55" y="448" width="130" height="56" rx="6" stroke-width="0.5"/>
<text class="title title-blue" x="120" y="464" text-anchor="middle" dominant-baseline="central">search_menu</text>
<text class="sub title-blue" x="120" y="484" text-anchor="middle" dominant-baseline="central">ChromaDB RAG</text>
<rect class="tool-coral" x="495" y="448" width="140" height="56" rx="6" stroke-width="0.5"/>
<text class="title title-coral" x="565" y="464" text-anchor="middle" dominant-baseline="central">get_order_status</text>
<text class="sub title-coral" x="565" y="484" text-anchor="middle" dominant-baseline="central">HITL if no ID</text>

<!-- Loop-back: tools → agents (fixed) -->
<path d="M55 476 L40 476 L40 368 L73 368" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M635 476 L650 476 L650 368 L607 368" fill="none" class="arr" marker-end="url(#arrow)"/>

<rect class="box-green" x="210" y="565" width="260" height="44" rx="8" stroke-width="0.5"/>
<text class="title title-green" x="340" y="587" text-anchor="middle" dominant-baseline="central">Synthesizer</text>

<rect class="box-teal" x="80" y="650" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="title title-teal" x="160" y="670" text-anchor="middle" dominant-baseline="central">OpenAI TTS</text>
<text class="sub" x="160" y="688" text-anchor="middle" dominant-baseline="central">speaker.py</text>
<rect class="box-gray" x="440" y="650" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="title title-gray" x="520" y="670" text-anchor="middle" dominant-baseline="central">Text output</text>
<text class="sub" x="520" y="688" text-anchor="middle" dominant-baseline="central">Terminal / CLI</text>

<!-- Fixed arrows -->
<line x1="160" y1="74" x2="160" y2="113" class="arr" marker-end="url(#arrow)"/>
<path d="M160 171 L160 190 L280 190 L280 213" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M520 74 L520 190 L400 190 L400 213" fill="none" class="arr" marker-end="url(#arrow)"/>

<!-- Orchestrator → Agents (conditional) -->
<path d="M270 271 L270 295 L155 295 L155 338" fill="none" class="arr" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<path d="M410 271 L410 295 L525 295 L525 338" fill="none" class="arr" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="label" x="340" y="308" text-anchor="middle" dominant-baseline="central">Send() — conditional dispatch</text>

<!-- Agents → Tools (conditional — dashed) -->
<line x1="120" y1="396" x2="120" y2="446" class="arr" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="565" y1="396" x2="565" y2="446" class="arr" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<!-- Agents → Synthesizer (FIXED — solid) -->
<path d="M215 396 L215 540 L280 540 L280 563" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M465 396 L465 540 L400 540 L400 563" fill="none" class="arr" marker-end="url(#arrow)"/>

<!-- Synthesizer → Outputs (fixed) -->
<path d="M270 609 L270 630 L160 630 L160 648" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M410 609 L410 630 L520 630 L520 648" fill="none" class="arr" marker-end="url(#arrow)"/>

<!-- MemorySaver -->
<rect x="2" y="205" width="32" height="420" rx="10" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="side-label" x="18" y="415" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 18 415)">MemorySaver (thread persistence)</text>

<!-- Legend -->
<line x1="478" y1="556" x2="508" y2="556" stroke="#888" stroke-width="1.5"/>
<text class="legend" x="514" y="560">Fixed edge</text>
<line x1="478" y1="574" x2="508" y2="574" stroke="#888" stroke-width="1.5" stroke-dasharray="5 3"/>
<text class="legend" x="514" y="578">Conditional edge</text>
</svg>
